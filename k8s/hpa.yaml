apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ccg-api
  namespace: cloud-cost-guardian
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ccg-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ccg-api
  namespace: cloud-cost-guardian
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ccg, component: api }
