apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccg-worker
  namespace: cloud-cost-guardian
  labels: { app: ccg, component: worker }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: ccg, component: worker }
  template:
    metadata:
      labels: { app: ccg, component: worker }
    spec:
      terminationGracePeriodSeconds: 120
      serviceAccountName: ccg
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/your-org/cloud-cost-guardian:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: JOBS_ENABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: ccg-config
            - secretRef:
                name: ccg-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
