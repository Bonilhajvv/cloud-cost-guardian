name: ci

on:
  push:
    branches: [master]
    tags: ['api-v*', 'agent-v*']
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - run: npm run build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/k8s-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/k8s-agent/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - uses: azure/setup-helm@v4
      - run: helm lint chart

  publish-api:
    if: startsWith(github.ref, 'refs/tags/api-v')
    needs: [api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#api-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/cloud-cost-guardian:${{ steps.meta.outputs.version }}

  publish-agent:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: [agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version="${GITHUB_REF_NAME#agent-v}"
          chart="$(grep '^version:' agents/k8s-agent/chart/Chart.yaml | awk '{print $2}')"
          test "$version" = "$chart" || { echo "tag $version != chart $chart"; exit 1; }
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: agents/k8s-agent
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/ccg-k8s-agent:${{ steps.meta.outputs.version }}
      - uses: azure/setup-helm@v4
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package agents/k8s-agent/chart
          helm push "ccg-k8s-agent-${{ steps.meta.outputs.version }}.tgz" "oci://ghcr.io/${{ steps.meta.outputs.owner }}/charts"
