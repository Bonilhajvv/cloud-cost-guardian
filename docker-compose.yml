services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ccg
      POSTGRES_PASSWORD: ccg
      POSTGRES_DB: ccg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccg -d ccg"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/database/data-source.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://ccg:ccg@postgres:5432/ccg
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ccg:ccg@postgres:5432/ccg
      JOBS_ENABLED: "false"
      LOG_JSON: "true"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ccg:ccg@postgres:5432/ccg
      JOBS_ENABLED: "true"
      LOG_JSON: "true"
      PORT: "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
