apiVersion: v1
kind: Secret
metadata:
  name: ccg-agent-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  CCG_AGENT_TOKEN: {{ required "agentToken is required" .Values.agentToken | quote }}
  CCG_API_URL: {{ required "apiUrl is required" .Values.apiUrl | quote }}
  CCG_CLUSTER_ID: {{ .Values.clusterId | quote }}
  CCG_INTERVAL_SECONDS: {{ .Values.intervalSeconds | quote }}
