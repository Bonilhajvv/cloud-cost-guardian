{{- if .Values.beyla.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ccg-beyla
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ccg-beyla
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ccg-beyla
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ccg-beyla
subjects:
  - kind: ServiceAccount
    name: ccg-beyla
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ccg-beyla-config
  namespace: {{ .Release.Namespace }}
data:
  beyla-config.yml: |
    attributes:
      kubernetes:
        enable: true
    routes:
      unmatched: heuristic
    discovery:
      services:
        - k8s_namespace: .
      exclude_services:
        - k8s_namespace: {{ printf "^(%s)$|%s" .Release.Namespace .Values.beyla.excludeNamespaces | quote }}
    otel_traces_export:
      endpoint: http://ccg-agent.{{ .Release.Namespace }}.svc:4318
      protocol: http/protobuf
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ccg-beyla
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ccg-beyla
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ccg-beyla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ccg-beyla
      annotations:
        checksum/config: {{ .Values.beyla | toJson | sha256sum }}
    spec:
      serviceAccountName: ccg-beyla
      hostPID: true
      containers:
        - name: beyla
          image: {{ .Values.beyla.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: BEYLA_CONFIG_PATH
              value: /config/beyla-config.yml
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.beyla.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: ccg-beyla-config
{{- end }}
